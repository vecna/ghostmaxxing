  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "@id": "https://ghostmaxxing.vecna.eu/codemap/codemap.html#webpage",
    "url": "https://ghostmaxxing.vecna.eu/codemap/codemap.html",
    "name": "Script Map — Ghostmaxxing",
    "description": "What each Ghostmaxxing maintainer script does: its options, the files and folders it reads and writes, the programs it runs, drawn as one flowchart per script.",
    "author": {
      "@type": "Person",
      "@id": "https://me.vecna.eu/#vecna",
      "name": "Claudio Agosti",
      "alternateName": "vecna",
      "url": "https://me.vecna.eu/",

    }

  <style>
    :root {
      --ink: #14100c;
      --ink-deep: #0c0906;
      --panel: #211a12;
      --panel-2: #2c2318;
      --line: rgba(255, 231, 168, 0.14);
      --line-soft: rgba(255, 231, 168, 0.07);
      --fg: #f6ece0;
      --muted: #b9a892;
      --faint: #8a7b6a;
      --orange: #fd5503;
      --yellow: #f3c747;
      --cream: #ffe7a8;
      --dev: #7fe3b0;
      --alert: #ff5b5b;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--ink-deep);
      color: var(--fg);
      font-family: var(--mono);
      font-size: 13px;
    }

    body {
      display: grid;
      grid-template-columns: 276px 1fr;
      grid-template-rows: auto 1fr;
      height: 100vh;
      overflow: hidden;
    }

    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: baseline;
      gap: 18px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--ink);
    }
    header h1 { margin: 0; font: 400 20px/1 var(--serif); color: var(--cream); letter-spacing: 0.01em; }
    header h1 em { font-style: italic; color: var(--orange); }
    header .meta { color: var(--faint); font-size: 11px; }
    header .meta b { color: var(--muted); font-weight: 500; }
    header input {
      margin-left: auto;
      width: 220px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--fg);
      font: inherit;
    }
    header input:focus { outline: 2px solid var(--orange); outline-offset: -1px; }

    aside {
      overflow: auto;
      border-right: 1px solid var(--line);
      background: var(--ink);
      padding-top: 10px;
    }
    .group { padding: 0 12px 18px; }
    .group > h2 {
      margin: 0 0 6px 6px;
      font: 500 10px/1 var(--mono);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--faint);
    }
    .chip {
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: 100%;
      padding: 7px 8px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: none;
      color: var(--muted);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .chip:hover { color: var(--fg); background: var(--panel); }
    .chip:focus-visible { outline: 2px solid var(--orange); outline-offset: -1px; }
    .chip[aria-pressed="true"] { color: var(--cream); border-color: var(--line); background: var(--panel); }
    .chip .name { font-size: 12px; }
    .chip .npm { font-size: 10px; color: var(--faint); }
    .chip[aria-pressed="true"] .npm { color: var(--dev); }
    .chip .n { font-size: 10px; color: var(--faint); }

    main { overflow: auto; background: var(--ink-deep); padding: 22px 28px 60px; }
    main > section { max-width: 1240px; }
    main h2 { margin: 0 0 4px; font: 400 26px/1.15 var(--serif); color: var(--cream); }
    main h2 code { font: 500 16px/1 var(--mono); color: var(--yellow); }
    main h3 {
      margin: 30px 0 10px;
      font: 500 10px/1 var(--mono);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--faint);
    }
    .summary { margin: 8px 0 0; max-width: 72ch; font: 15px/1.5 var(--serif); color: var(--fg); }
    .invoke { margin: 10px 0 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .invoke code { color: var(--dev); }
    .invoke .alias { color: var(--faint); }

    .stage {
      position: relative;
      margin-top: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--ink);
      padding: 14px;
      overflow: auto;
    }
    .stage svg { max-width: none; }
    .stage .tools { position: sticky; top: 0; float: right; display: flex; gap: 6px; }
    .stage .tools button, .stage .tools a {
      padding: 4px 9px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--panel);
      color: var(--muted);
      font: inherit;
      font-size: 11px;
      text-decoration: none;
      cursor: pointer;
    }
    .stage .tools button:hover, .stage .tools a:hover { color: var(--fg); }
    .stage .offline {
      white-space: pre;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .legend { display: flex; flex-wrap: wrap; gap: 14px 22px; margin-top: 10px; font-size: 11px; color: var(--muted); }
    .legend span { display: inline-flex; align-items: center; gap: 7px; }
    .legend i { display: inline-block; width: 22px; height: 12px; border: 1.5px solid currentColor; background: var(--ink); }
    .legend .w { color: var(--yellow); }
    .legend .r { color: var(--dev); }
    .legend .r i { transform: skewX(14deg); }
    .legend .w i { transform: skewX(-14deg); }
    .legend .d { color: var(--alert); }
    .legend .x { color: var(--orange); }
    .legend .x i { clip-path: polygon(20% 0, 80% 0, 100% 50%, 80% 100%, 20% 100%, 0 50%); background: currentColor; opacity: 0.8; }
    .legend .f { color: var(--cream); }
    .legend .f i { border-radius: 2px; }
    .legend .o { color: var(--muted); }
    .legend .o i { border-radius: 50%/40%; }
    .legend .c { color: var(--faint); }

    table { border-collapse: collapse; width: 100%; font-size: 12px; }
    th, td { padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line-soft); vertical-align: top; text-align: left; }
    th { font-weight: 500; color: var(--faint); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; }
    td code { color: var(--cream); }
    td .flag { color: var(--yellow); }
    td .dflt { color: var(--faint); }
    td .kind { display: inline-block; min-width: 44px; }
    td .kind.read { color: var(--dev); }
    td .kind.probe { color: var(--faint); }
    td .kind.write { color: var(--yellow); }
    td .kind.delete { color: var(--alert); }
    td .kind.exec, td .kind.serve, td .kind.browser, td .kind.network { color: var(--orange); }
    td .when { color: var(--muted); }
    td .lines { color: var(--faint); }
    td.target { word-break: break-all; }

    details { margin-top: 10px; }
    details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
    details pre {
      margin: 10px 0 0;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--ink);
      color: var(--muted);
      white-space: pre-wrap;
      font-size: 12px;
      line-height: 1.55;
    }

    .about { max-width: 78ch; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .about dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 10px 0 0; }
    .about dt { color: var(--cream); }
    .about dd { margin: 0; }
    footer { margin-top: 40px; color: var(--faint); font-size: 11px; }
    footer a { color: var(--muted); }

    @media (max-width: 760px) {
      body { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; height: auto; overflow: auto; }
      aside { max-height: 220px; border-right: 0; border-bottom: 1px solid var(--line); }
      header input { width: 140px; }
      main { padding: 16px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>Ghost<em>maxxing</em> script map</h1>
    <span class="meta"><b id="sCount">0</b> scripts &middot; <b id="kCount">0</b> side effects &middot; generated <b id="gen"></b></span>
    <input id="search" type="search" placeholder="filter scripts…" aria-label="Filter scripts" />
  </header>

  <aside>
    <div class="group">
      <h2>npm run …</h2>
      <div id="listNpm"></div>
    </div>
    <div class="group">
      <h2>node … directly</h2>
      <div id="listDirect"></div>
    </div>
    <div class="group">
      <h2>Reading the map</h2>
      <button class="chip" id="aboutBtn"><span class="name">how this is made</span><span class="npm">static analysis, no execution</span></button>
    </div>
  </aside>

  <main>
    <section id="view" aria-live="polite"></section>
  </main>

  <script>
    const CODEMAP = /*__CODEMAP__*/ null;
  </script>
  <script type="module">
    // Mermaid is the one external script on this site. Without it (offline,
    // blocked), the page still shows the flow as text and the tables below it.
    let mermaid = null;
    try {
      mermaid = (await import('https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs')).default;
      mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        theme: 'base',
        flowchart: { curve: 'basis', htmlLabels: true, useMaxWidth: false, nodeSpacing: 26, rankSpacing: 46, padding: 10, wrappingWidth: 260 },
        themeVariables: {
          fontFamily: 'ui-monospace, SF Mono, JetBrains Mono, Menlo, Consolas, monospace',
          fontSize: '12px',
          primaryColor: '#211a12', primaryTextColor: '#f6ece0', primaryBorderColor: '#ffe7a8',
          lineColor: '#8a7b6a', edgeLabelBackground: '#14100c', tertiaryColor: '#14100c',
          background: '#14100c', mainBkg: '#211a12', nodeBorder: '#ffe7a8', clusterBkg: '#14100c',
        },
      });
    } catch (err) {
      console.warn('mermaid not available, showing the flow as text', err);
    }

    const scripts = CODEMAP.scripts;
    const $ = (id) => document.getElementById(id);
    const h = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    $('sCount').textContent = scripts.length;
    $('kCount').textContent = scripts.reduce((n, s) => n + (s.sinks || []).length, 0);
    $('gen').textContent = CODEMAP.generatedAt.slice(0, 10);

    // ---- sidebar
    const chips = new Map();
    function chip(s) {
      const b = document.createElement('button');
      b.className = 'chip';
      b.setAttribute('aria-pressed', 'false');
      const npm = (s.npm || []).map((n) => n.name);
      b.innerHTML = `<span class="name">${h(s.id.replace(/^scripts-dev\//, ''))}</span>` +
        (npm.length ? `<span class="npm">npm run ${h([...new Set(npm)].join(', '))}</span>` : '') +
        `<span class="n">${s.options.length ? s.options.length + ' options · ' : ''}${(s.sinks || []).length} side effects</span>`;
      b.addEventListener('click', () => show(s.id));
      chips.set(s.id, b);
      return b;
    }
    for (const s of scripts) ((s.npm || []).length ? $('listNpm') : $('listDirect')).append(chip(s));

    $('search').addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      for (const [id, b] of chips) {
        const s = scripts.find((x) => x.id === id);
        const hay = `${id} ${(s.npm || []).map((n) => n.name).join(' ')} ${s.summary} ${(s.sinks || []).map((k) => k.target).join(' ')}`.toLowerCase();
        b.hidden = q && !hay.includes(q);
      }
    });
    $('aboutBtn').addEventListener('click', about);

    // ---- one script
    const KIND_WORD = { read: 'reads', probe: 'checks', write: 'writes', delete: 'deletes', exec: 'runs', serve: 'serves', browser: 'opens', network: 'fetches' };

    function fmtDefault(v) {
      if (v === undefined) return '';
      if (v === null) return 'none';
      if (Array.isArray(v)) return v.join(',');
      return String(v);
    }

    async function show(id) {
      const s = scripts.find((x) => x.id === id);
      if (!s) return;
      for (const [k, b] of chips) b.setAttribute('aria-pressed', String(k === id));
      history.replaceState(null, '', `#${encodeURIComponent(id)}`);

      const invoke = s.lang === 'py' ? `python3 ${s.id}` : `node ${s.id}`;
      const aliases = (s.npm || []).map((n) => `<code>npm run ${h(n.name)}</code>${n.args ? ` <span class="alias">${h(n.args)}</span>` : ''}`);
      const sub = s.subcommands.length ? `<div>subcommands: ${s.subcommands.map((c) => `<code>${h(c)}</code>`).join(' ')}</div>` : '';

      const optionRows = s.options.map((o) => `<tr>
          <td><span class="flag">${h(o.flag)}</span>${o.aliases && o.aliases.length ? ` <span class="dflt">${h(o.aliases.join(' '))}</span>` : ''}</td>
          <td>${o.type === 'boolean' ? 'switch' : 'value'}</td>
          <td><span class="dflt">${h(fmtDefault(o.default))}</span></td>
        </tr>`).join('');

      const sinkRows = (s.sinks || [])
        .slice()
        .sort((a, b) => a.fn.localeCompare(b.fn) || a.line - b.line)
        .map((k) => `<tr>
          <td><span class="kind ${h(k.kind)}">${KIND_WORD[k.kind] || k.kind}</span></td>
          <td class="target"><code>${h(k.target)}</code>${k.source ? ` <span class="dflt">from ${h(k.source)}</span>` : ''}${k.args && k.args.length ? ` <span class="dflt">${h(k.args.join(' '))}</span>` : ''}</td>
          <td>${h(k.fn)}()</td>
          <td><span class="when">${h(k.when || '')}</span></td>
          <td><span class="lines">${h(k.line)}</span></td>
        </tr>`).join('');

      $('view').innerHTML = `
        <h2>${h(s.id.split('/').pop())} <code>${h(s.id.replace(/[^/]+$/, ''))}</code>${s.version ? ` <code>v${h(s.version)}</code>` : ''}</h2>
        <p class="summary">${h(s.summary || 'No header comment: the script does not say what it is for.')}</p>
        <div class="invoke"><div><code>${h(invoke)}</code>${aliases.length ? ' &middot; ' + aliases.join(' &middot; ') : ''}</div>${sub}</div>

        <h3>Flow</h3>
        <div class="stage" id="stage">
          <div class="tools">
            <button id="copyMmd" type="button">copy mermaid</button>
            <a href="mmd/${h(s.id.split('/').pop().replace(/\.\w+$/, ''))}.mmd" download>.mmd</a>
          </div>
          <div id="diagram"></div>
        </div>
        <div class="legend">
          <span class="f"><i></i>function main() calls</span>
          <span class="r"><i></i>file read</span>
          <span class="w"><i></i>file written</span>
          <span class="o"><i></i>folder</span>
          <span class="d"><i></i>deleted</span>
          <span class="x"><i></i>program run</span>
          <span class="c">edge label: the option that gates the step</span>
        </div>

        ${s.options.length ? `<h3>Options</h3>
        <table><thead><tr><th>flag</th><th>kind</th><th>default</th></tr></thead><tbody>${optionRows}</tbody></table>` : ''}

        <h3>Files, folders and programs</h3>
        ${sinkRows ? `<table><thead><tr><th>action</th><th>target</th><th>in</th><th>when</th><th>line</th></tr></thead><tbody>${sinkRows}</tbody></table>`
          : '<p class="about">No filesystem, process or network side effect was found in this script.</p>'}
        <p class="about">Paths are expressions, not a trace: <code>ROOT</code> is the repository, <code>$CWD</code> the directory the command runs from, <code>$TMPDIR</code> the system temporary directory, <code>← --flag</code> a path given on the command line, <code>&lt;name&gt;</code> a variable the extractor could not resolve, <code>&lt;computed&gt;</code> a value built from data at run time.</p>

        ${s.header ? `<details><summary>Header comment from the source</summary><pre>${h(s.header)}</pre></details>` : ''}
        ${s.requires && s.requires.length ? `<p class="about">Requires: ${s.requires.map((r) => `<code>${h(r)}</code>`).join(' ')}</p>` : ''}
      `;

      $('copyMmd').addEventListener('click', () => navigator.clipboard && navigator.clipboard.writeText(s.mermaid));

      const target = $('diagram');
      if (mermaid) {
        try {
          const { svg } = await mermaid.render(`svg-${Date.now()}`, s.mermaid);
          target.innerHTML = svg;
        } catch (err) {
          target.innerHTML = `<pre class="offline">${h(s.mermaid)}</pre>`;
          console.warn(err);
        }
      } else {
        target.innerHTML = `<pre class="offline">${h(textFlow(s))}</pre>`;
      }
    }

    /** Plain-text rendering of the flow, for when the diagram library is unavailable. */
    function textFlow(s) {
      const out = [];
      for (const st of s.flow.steps) {
        out.push(`${st.when ? `[${st.when}] ` : ''}${st.fn}()${st.doc ? `  — ${st.doc}` : ''}`);
        for (const k of st.sinks) out.push(`    ${(KIND_WORD[k.kind] || k.kind).padEnd(8)} ${k.target}${k.when ? `   (${k.when})` : ''}`);
      }
      for (const k of s.flow.direct) out.push(`${(KIND_WORD[k.kind] || k.kind).padEnd(8)} ${k.target}${k.when ? `   (${k.when})` : ''}`);
      return out.join('\n') || '(nothing to draw)';
    }

    function about() {
      for (const b of chips.values()) b.setAttribute('aria-pressed', 'false');
      history.replaceState(null, '', '#about');
      const legend = Object.entries(CODEMAP.legend || {}).map(([k, v]) => `<dt><code>${h(k)}</code></dt><dd>${h(v)}</dd>`).join('');
      $('view').innerHTML = `
        <h2>How this map is made</h2>
        <div class="about">
          <p><code>scripts-dev/build-codemap.js</code> reads every script a person can run directly — the <code>node …</code> and <code>python3 …</code> commands in <code>package.json</code>, plus the executables in <code>scripts-dev/</code> — and parses the source without executing it. Aggregations such as <code>npm run htmls</code> are only <code>&amp;&amp;</code> chains of these and are not drawn.</p>
          <p>For each script it keeps: the first paragraph of the header comment (the purpose, written by a person, not inferred); the command-line options with their defaults and the subcommands; the functions <code>main()</code> calls, in order, each with the first sentence of its JSDoc; and every filesystem, process, server and network call, with the path written as an expression, the function it lives in, and the <code>if (options.x)</code> condition that gates it. Paths reached through a helper are resolved one call deep, so <code>writeImage(buffer, file)</code> shows the file the caller passed.</p>
          <p>Depth is deliberately shallow — one level of functions below <code>main()</code>, and option conditions only — so the chart stays a map of what a run does to the repository, not a call graph. The source and its header comment remain the reference; this page says where to look.</p>
          <dl>${legend}</dl>
          <p>Regenerate with <code>npm run codemap</code>. The Mermaid sources are also written to <code>codemap/mmd/</code>, one per script, for use in documentation.</p>
        </div>`;
    }

    function route() {
      const wanted = decodeURIComponent(location.hash.slice(1));
      if (wanted === 'about') about();
      else show(scripts.some((s) => s.id === wanted) ? wanted : scripts.find((s) => (s.npm || []).length)?.id || scripts[0].id);
    }
    window.addEventListener('hashchange', route);
    route();
  </script>
  <footer hidden><a href="../">Ghostmaxxing</a></footer>
</body>

</html>
