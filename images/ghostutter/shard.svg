<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" aria-hidden="true"><!--
  Ghostutter — the shard mark.

  Six irregular wedges radiating from one pivot: dazzle geometry, the hard-edged
  wedges painted on WWI ships. Irregular on purpose, so it never settles into
  reading as an interface glyph (no even spokes, no clock hands).

  Two ways to use it:
    <img src="shard.svg">                -> renders pink (#ff2f7a) as authored
    mask-image: url("shard.svg")         -> colour comes from --ghostutter-colour

  styles/ghostutter.css uses the mask route, which is why the fill below is only
  a fallback for direct <img> use. Do not add a viewBox padding: the wedges are
  measured from the 50,50 pivot and the CSS rotates around that same point.
--><g fill="#ff2f7a"><path d="M50 50 L44 10 L58 18 Z"/><path d="M50 50 L86 24 L90 41 Z"/><path d="M50 50 L92 60 L75 73 Z"/><path d="M50 50 L58 90 L39 85 Z"/><path d="M50 50 L14 75 L12 57 Z"/><path d="M50 50 L10 35 L25 25 Z"/></g></svg>
