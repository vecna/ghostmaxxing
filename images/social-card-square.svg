<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-labelledby="title desc">
<title id="title">Ghostmaxxing square social card</title>
<desc id="desc">Square orange social card for Ghostmaxxing with the broken-lens camera mark and camera-flower landscape motif.</desc>
<rect width="1080" height="1080" fill="#f26a1b"/>
<rect y="0" width="1080" height="1080" fill="url(#warmth)"/>
<defs>
  <linearGradient id="warmth" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#fd5503"/>
    <stop offset="1" stop-color="#df5512"/>
  </linearGradient>
</defs>
<image href="ghostmaxxing-mark.svg" x="82" y="84" width="154" height="130" preserveAspectRatio="xMidYMid meet"/>
<text x="260" y="170" font-family="Iowan Old Style, Palatino Linotype, Book Antiqua, Palatino, Georgia, serif" font-size="72" font-weight="700" fill="#050505">Ghostmaxxing</text>
<text x="86" y="404" font-family="Iowan Old Style, Palatino Linotype, Book Antiqua, Palatino, Georgia, serif" font-size="118" font-weight="700" fill="#050505">Disrupt</text>
<text x="86" y="520" font-family="Iowan Old Style, Palatino Linotype, Book Antiqua, Palatino, Georgia, serif" font-size="118" font-weight="700" fill="#050505">the read.</text>
<text x="92" y="612" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="760" fill="#071a33">A public lab for testing</text>
<text x="92" y="656" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="760" fill="#071a33">face-recognition camouflage</text>
<image href="homepage-camera-band.svg" x="-640" y="650" width="2360" height="354" preserveAspectRatio="xMidYMax slice" opacity="0.96"/>
</svg>
