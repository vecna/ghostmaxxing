      <path d="m 558.22339,719.64788 q 13.19147,-24.73512 -2.4176,-48.37228 -13.19146,24.73512 2.4176,48.37228 z" fill="var(--gm-green, #063f32)" stroke="var(--gm-green-deep, #04302a)" stroke-width="1.3721"></path>
      <path d="m 577.90081,735.13175 q 13.19147,-24.73512 -2.4176,-48.37228 -13.19146,24.73512 2.4176,48.37228 z" fill="var(--gm-green, #063f32)" stroke="var(--gm-green-deep, #04302a)" stroke-width="1.3721"></path>
      <path d="m 704.82169,676.64821 q -13.86116,-24.72339 2.54033,-48.34934 13.86115,24.72339 -2.54033,48.34934 z" fill="var(--gm-green, #063f32)" stroke="var(--gm-green-deep, #04302a)" stroke-width="1.40616"></path>
      <path d="m 679.39643,694.19865 q -13.86115,-24.72339 2.54034,-48.34934 13.86115,24.72339 -2.54034,48.34934 z" fill="var(--gm-green, #063f32)" stroke="var(--gm-green-deep, #04302a)" stroke-width="1.40616"></path>
      <path d="m 655.66944,710.96489 q -13.86116,-24.72339 2.54033,-48.34934 13.86115,24.72339 -2.54033,48.34934 z" fill="var(--gm-green, #063f32)" stroke="var(--gm-green-deep, #04302a)" stroke-width="1.40616"></path>
      <path d="m 634.99306,726.44142 q -13.86116,-24.72339 2.54033,-48.34934 13.86115,24.72339 -2.54033,48.34934 z" fill="var(--gm-green, #063f32)" stroke="var(--gm-green-deep, #04302a)" stroke-width="1.40616"></path>
  </g>

  <g id="canopy-leaves">
    <path d="M 565.22733,568.13055 Q 528.63821,474.32953 412.77268,444.70816 449.36179,538.50918 565.22733,568.13055 Z" fill="var(--gm-green-soft, #1e6b4f)" stroke="var(--gm-green-deep, #04302a)" stroke-width="5.01851"></path>
