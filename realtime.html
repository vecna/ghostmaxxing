<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ghostmaxxing | Latent Space Visualizer for Face Descriptor Drift</title>
  <meta
    name="description"
    content="Real-time visual debugger for face descriptor drift, equalizer deltas, and biometric distance thresholds."
  />
  <meta property="og:title" content="Ghostmaxxing | Latent Space Visualizer for Face Descriptor Drift" />
  <meta property="og:description" content="Watch live face descriptor drift, equalizer deltas, and distance thresholds in a real-time visual debugging view." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/images/social-card.svg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Ghostmaxxing | Latent Space Visualizer for Face Descriptor Drift" />
  <meta name="twitter:description" content="Watch live face descriptor drift, equalizer deltas, and distance thresholds in a real-time visual debugging view." />
  <meta name="twitter:image" content="/images/social-card.svg" />
  <link rel="icon" type="image/svg+xml" href="/images/logo/mark-onlight.svg">

  <link rel="stylesheet" href="/styles/styles.css" />
  <link rel="stylesheet" href="/styles/lab.css" />
  <link rel="stylesheet" href="/styles/realtime.css" />
</head>

<body>
  <main id="ui-layer" aria-label="Latent space visualizer">
    <a
      class="seg seg--home realtime-home-link"
      href="/"
      aria-label="Home"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <path d="M3 10.5 12 3l9 7.5" />
        <path d="M5 9.5V21h14V9.5" />
        <path d="M9.5 21v-6h5v6" />
      </svg>
    </a>

    <section id="graph-container" aria-label="Global descriptor distance graph">
      <header class="panel-header">
        <p class="panel-title">Distance</p>
        <p class="panel-value"><span id="distance-value">0.000</span></p>
      </header>
      <canvas id="distance-graph" width="220" height="760" aria-label="Distance history"></canvas>
      <p class="panel-note">Threshold: 0.6</p>
    </section>

    <section id="center-view" aria-label="Webcam and calibration controls">
      <video id="webcam" autoplay muted playsinline></video>
      <div class="video-scrim"></div>
      <div id="status-pill" aria-live="polite">Loading models...</div>
      <div id="calibration-ui">
        <div id="countdown-circle" aria-live="assertive">3</div>
        <button id="btn-reset" type="button">Set Baseline</button>
      </div>
    </section>

    <section id="embedding-panel" aria-label="128-dimensional descriptor equalizer">
      <header class="panel-header">
        <p class="panel-title">Descriptor Delta</p>
        <p class="panel-value"><span id="tracking-state">CALIBRATING</span></p>
      </header>
      <div id="embedding-bar" aria-label="128 descriptor rows"></div>
    </section>
  </main>

  <script src="/scripts/vendor/face-api.js"></script>
  <script type="module" src="/scripts/realtime.js"></script>
</body>

</html>
